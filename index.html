<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>答案之书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-label="答案之书小游戏">
      <section class="stage">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <div class="book-wrap" id="bookWrap">
          <div class="book" id="book" aria-live="polite">
            <div class="pages">
              <div class="page page-left" aria-hidden="true">
                <div class="inner-border">
                  <p class="left-kicker">这一页的征兆</p>
                  <div class="motif" id="motif" data-theme="quiet">
                    <span class="motif-mark motif-large">心</span>
                    <span class="motif-mark motif-small motif-a">静</span>
                    <span class="motif-mark motif-small motif-b">光</span>
                    <span class="motif-mark motif-small motif-c">问</span>
                  </div>
                  <p class="left-note" id="leftNote">把问题放轻一点，答案会慢慢显影。</p>
                </div>
              </div>

              <div class="page page-right">
                <div class="inner-border answer-panel">
                  <p class="answer-label">这一页写着</p>
                  <p class="answer" id="answer">答案正在页缝里等你。</p>
                </div>
              </div>

              <div class="flutter-stack" aria-hidden="true">
                <span class="flutter-page flutter-one"></span>
                <span class="flutter-page flutter-two"></span>
                <span class="flutter-page flutter-three"></span>
                <span class="flutter-page flutter-four"></span>
              </div>
            </div>

            <div class="cover">
              <p class="cover-en">The Book of Answers</p>
              <p class="cover-tags">情绪自救 / 停止内耗 / 化解焦虑 / 自我疗愈</p>
              <div class="cover-frame" aria-hidden="true">
                <span class="cover-corner cover-corner-a"></span>
                <span class="cover-corner cover-corner-b"></span>
                <span class="cover-corner cover-corner-c"></span>
                <span class="cover-corner cover-corner-d"></span>
                <h1>答案<br />之书</h1>
              </div>
              <p class="prompt">对纠结的人生说“再见”</p>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="primary-button" id="reveal" type="button">
            <span class="button-icon" aria-hidden="true">✦</span>
            翻开一页
          </button>
          <button class="ghost-button" id="reset" type="button" disabled>合上书</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
